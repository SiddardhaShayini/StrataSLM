[project]
name = "strataslm"
version = "0.1.0"
description = "Featherweight, deterministic local AI runtime & cognitive memory engine for 8GB CPU-only laptops"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "psutil>=6.1.0",
    "pydantic>=2.9.0",
    "sqlite-vec>=0.1.6",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
strata = "strata.cli:main"

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.20.0",
    "tokenizers>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/SiddardhaShayini/StrataSLM"
Repository = "https://github.com/SiddardhaShayini/StrataSLM"
Issues = "https://github.com/SiddardhaShayini/StrataSLM/issues"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
