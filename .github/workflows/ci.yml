name: StrataSLM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-eval:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --locked --group dev

      - name: Run full test suite
        run: uv run --no-sync pytest -v

      - name: Run deterministic evaluation suite
        run: uv run --no-sync strata bench eval

      - name: Run embedder fallback benchmark
        run: uv run --no-sync strata bench embedders
